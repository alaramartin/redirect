<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website blocked</title>
    <style>
      /* keep these values in sync with src/styles/style.css's :root custom
         properties -- this file is copied verbatim by Vite (not part of the
         React build), so it can't share that stylesheet. */
      :root {
        --color-bg: #eef2f4;
        --color-panel: #f8fafb;
        --color-border: #d7e0e4;
        --color-text: #33424a;
        --color-text-muted: #6b7c84;
        --radius: 8px;
        --radius-sm: 6px;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--color-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .title {
        font-size: 22px;
        font-weight: 600;
        color: var(--color-text);
        background: var(--color-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        padding: 22px 46px;
      }
      .site {
        font-size: 15px;
        color: var(--color-text-muted);
      }
      .countdown {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .countdown-text {
        font-size: 15px;
        color: var(--color-text-muted);
      }
      .cancel {
        font-family: inherit;
        font-size: 14px;
        color: var(--color-text);
        background: #fff;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        padding: 5px 14px;
        cursor: pointer;
      }
      .cancel:hover {
        background: var(--color-bg);
      }
      .notice {
        display: none;
        font-size: 14px;
        color: var(--color-text-muted);
        max-width: 560px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">website blocked</div>
      <div id="blocked-site" class="site"></div>
      <div id="countdown" class="countdown">
        <div id="countdown-text" class="countdown-text"></div>
        <button id="cancel-redirect" class="cancel">Cancel redirect</button>
      </div>
      <div id="notice" class="notice"></div>
    </div>
    <script src="block-page.js"></script>
  </body>
</html>
